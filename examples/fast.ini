# ==============================================================================
# Wheeler-DeWitt Solver - FAST TEST CONFIGURATION
# ==============================================================================

# --- Grid Discretization (Baixa resolução para teste rápido) ---
Na          1000             # Reduzido de 6000 para 100
Nphi        1500             # Reduzido de 9000 para 150
a           20              
phi         40              

# --- Effective Potential (Vef) ---
Lambda      1.5             
m           0.1             
aVmax       1.0             

# --- Initial Wave Function (Psi0) ---
Ea          5.498           
Ephi        4.0             

# --- Conjugate Gradient (CG) Solver ---
Imax        500             
Emax        1e-8            
Resume      false           

# --- Time Evolution (Simulação curta) ---
Tlast       1            	
T           0.001             # Tempo inicial
DeltaT      0.001           # Passo de tempo maior (Resultará em apenas 10 passos no total)
Print       2               # Vai salvar os dados a cada 2 passos (em vez de 2500)

# --- Checkpoints & Output Data ---
rest        0.0             
resfile     teste_rapido    
file        teste_          
BaseDir     dados_teste     # Vai criar esta pasta automaticamente
Zero        0